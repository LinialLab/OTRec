name: Validate Gradio Space

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'dl_model_def.py'
      - 'vocab_io.py'
      - 'runtime_data.py'
      - 'prepare_runtime_artifacts.py'
      - 'requirements.txt'
      - 'README.md'
      - 'data/proc/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Verify packaged runtime artifacts
      run: |
        python - <<'PY'
        from pathlib import Path

        required = [
            Path('data/proc/df_learn_sub.parquet'),
            Path('data/proc/disease_df.parquet'),
            Path('data/proc/target_df.parquet'),
            Path('data/proc/comparison_lookup.parquet'),
            Path('data/proc/disease_metadata.csv'),
        ]
        missing = [str(path) for path in required if not path.exists()]
        if missing:
            raise SystemExit(f'Missing packaged runtime artifacts: {missing}')
        print('Packaged runtime artifacts are present.')
        PY

    - name: Smoke test reviewer path
      run: |
        python - <<'PY'
        import app
        summary, note, table_html, csv_path, full_csv_path = app.recommend_targets(
            'DOID_0050890',
            top_k=10,
            filter_mode='Novel predictions only',
            sort_label='OTRec score',
            min_score=0.0,
        )
        table_html = str(table_html)
        assert table_html.count('<tr>') > 1, 'ranked table is empty'
        assert 'platform.opentargets.org/target' in table_html, 'gene links missing'
        assert csv_path and full_csv_path
        print(summary.splitlines()[0])
        PY
